        code: "# pylint: disable=missing-module-docstring\n# pylint: disable=invalid-name\n\
          \n\n# output keys  #################################################################\n\
          OUTPUT_OPT_OBJ = \"opt_obj\"\n\n\n# constants  ###################################################################\n\
          \n# ordinary-edit sigils, indexed by add/delete lean: addition, balanced,\
          \ deletion\nSIGILS_SHORT = (\"\U0001F7E2\", \"\U0001F7E1\", \"\U0001F534\
          \")\nSIGILS_LONG = (\"\U0001F7E9\", \"\U0001F7E8\", \"\U0001F7E5\")\n\n\
          # special-case sigils the LLM may emit directly\nVALID_SIGILS = frozenset((\n\
          \    \"\U0001F522\",\n    \"\U0001F4C4\",\n    \"\U0001F5D1️\",\n    \"\U0001F4C2\
          \",\n    \"\U0001F4DB\",\n    \"\U0001F512\",\n    \"\U0001F4CF\",\n   \
          \ \"\U0001F516\",\n    \"\U0001F4DD\",\n    \"♻️\",\n    \"\U0001F916\"\
          ,\n    \"\U0001F9EA\",\n    \"\U0001F9F8\",\n    \"\U0001F528\",\n    \"\
          \U0001F4E6\",\n    \"⚙️\",\n    \"\U0001F530\",\n    \"\U0001F3F7️\",\n\
          \    \"\U0001FAA7\",\n    \"\U0001FAB5\",\n    \"\U0001F4D6\",\n    \"\U0001F41A\
          \",\n))\n\n# add/delete lean knobs  =======================================================\n\
          \n# imaginary lines credited to both sides, swamping low-volume counts\n\
          LEAN_PSEUDOCOUNT = 2\n\n# integer form of the log-odds cut: 12/5 = 2.4 approximates\
          \ exp(0.85)\nLEAN_CUT_HIGH = 12\nLEAN_CUT_LOW = 5\n\n\n# auxiliaries  #################################################################\n\
          def _decide_add_del_balance(added, deleted):\n    \"\"\"\n    see ``docs/diff-shape-classification.md``\n\
          \n    :return: which way the diff leans, judging the add/delete gap\n  \
          \          by smoothed log-odds, with the pure cases short-circuited:\n\
          \            0 addition, 1 balanced, 2 deletion\n    :rtype: int\n    \"\
          \"\"\n    assert added or deleted, \"an empty diff has no lean\"\n\n   \
          \ if deleted == 0:\n        return 0\n    if added == 0:\n        return\
          \ 2\n\n    smoothed_added = added + LEAN_PSEUDOCOUNT\n    smoothed_deleted\
          \ = deleted + LEAN_PSEUDOCOUNT\n\n    # mutually exclusive, so their order\
          \ is immaterial\n    if LEAN_CUT_LOW * smoothed_added > LEAN_CUT_HIGH *\
          \ smoothed_deleted:\n        return 0\n    if LEAN_CUT_LOW * smoothed_deleted\
          \ > LEAN_CUT_HIGH * smoothed_added:\n        return 2\n    return 1\n\n\n\
          def _resolve_ordinary_sigil(LONG_SHORT_THRESHOLD, per_file_diff):\n    \"\
          \"\"\n    :return: ordinary-edit sigil for the diff,\n            resolved\

    - data:
        code: "# pylint: disable=missing-module-docstring\n\n\n# output keys  #################################################################\n\
          OUTPUT_ANSWER = \"answer\"\n\n\n# constants  ###################################################################\n\
          KEY_SIGIL = \"sigil\"\nKEY_MESSAGE = \"message\"\n\nANSWER_TEMPLATE = \"\
          {}\\n\\n{}\"\n\n\n# auxiliaries  ##################################################################\n\
          \n\ndef _merge_single(allows_md, filenames, per_file_extracts):\n    \"\"\
          \"\n    merge the answer for the single-file, no-primary-message scenario\n\
          \    \"\"\"\n    filename = filenames[0]\n    file_extract = per_file_extracts[0]\n\
          \    sigil = file_extract[KEY_SIGIL]\n    message = file_extract[KEY_MESSAGE]\n\
          \n    filename_line = (\"{}`{}`\" if allows_md else \"{}[{}]\").format(\n\
          \        sigil, filename\n    )\n\n    return ANSWER_TEMPLATE.format(message,\
          \ filename_line)\n\n\ndef _merge_multiple(allows_md, filenames, per_file_extracts,\
          \ primary_message):\n    \"\"\"\n    merge the answer for the multiple-file,\
          \ with-primary-message scenario\n    \"\"\"\n    line_pattern = \"{}`{}`\
          \ {}\" if allows_md else \"{}[{}] {}\"\n\n    lines = []\n    for filename,\
          \ file_extract in zip(filenames, per_file_extracts):\n        sigil = file_extract[KEY_SIGIL]\n\
          \        message = file_extract[KEY_MESSAGE]\n        line = line_pattern.format(sigil,\
          \ filename, message)\n        lines.append(line)\n\n    return ANSWER_TEMPLATE.format(primary_message,\
          \ \"\\n\".join(lines))\n\n\n# Entry Point  #################################################################\n\
          def main(\n    allows_md: bool,\n    skip_primary_message: bool,\n    filenames:\
          \ list[str],\n    per_file_extracts: list[dict],\n    primary_message: str,\n\
          ):\n    \"\"\"\n    merge to produce the final answer, from all per-file\
          \ extracts\n\n    - when ``skip_primary_message`` is set, only a single\
          \ file is\n      involved, so the answer is the file's message followed\
          \ by its\n      sigil/filename line\n    - otherwise, the answer is the\
          \ primary message followed by one\n      line per file, each with its sigil,\
          \ filename, and message\n\n\n    :param allows_md: whether utilize md format\
          \ in final result\n    :type allows_md: bool\n    :param skip_primary_message:\
          \ whether only a single file is involved\n    :type skip_primary_message:\
          \ bool\n    :param filenames:\n    :type filenames: list[str]\n    :param\
          \ per_file_extracts: opt_obj entries, as returned by post_per_file\n   \
          \ :type per_file_extracts: list[dict]\n    :param primary_message:\n   \
          \ :type primary_message: str\n    :return: {\"answer\": merged final answer}\n\
          \    :rtype: dict{\"answer\": str}\n    \"\"\"\n    if skip_primary_message:\n\
          \        answer = _merge_single(allows_md, filenames, per_file_extracts)\n\
          \    else:\n        answer = _merge_multiple(\n            allows_md, filenames,\
          \ per_file_extracts, primary_message\n        )\n\n    return {OUTPUT_ANSWER:\
          \ answer}\n\n"
        code_language: python3

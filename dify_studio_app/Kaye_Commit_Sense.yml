    - data:
        code: "# pylint: disable=missing-module-docstring\n\n\nimport re\n\n# output\
          \ keys  #################################################################\n\
          \nOUTPUT_SKIP_PRIMARY = \"skip_primary_message\"\nOUTPUT_PER_FILE_DIFF =\
          \ \"per_file_diff\"\nOUTPUT_FILENAMES = \"filenames\"\n\n\n# constants \
          \ ###################################################################\n\
          DIFF_GIT = \"diff --git\"\nREGEX_PATTERN = r\".+\\/(.+)\"\n\n\n# Entry Point\
          \  #################################################################\ndef\
          \ main(content: str):\n    \"\"\"\n    perform pre-process directly on inputs:\n\
          \n    - split the full diff content per file\n    - extract each file's\
          \ name, ordered the same as ``per_file_diff``\n    - decide if there is\
          \ only one file change, to skip the primary message\n\n\n    :param content:\n\
          \    :type content: str\n    :return: {\n        \"skip_primary_message\"\
          : if the given content contains only single file\n        \"per_file_diff\"\
          : a list of all files' diff content\n        \"filenames\": a list of all\
          \ files' name\n    }\n    :rtype: dict{\n        \"skip_primary_message\"\
          : bool\n        \"per_file_diff\": list[str]\n        \"filenames\": list[str]\n\
          \    }\n    \"\"\"\n    per_file_diff = []\n    filenames = []\n\n    for\
          \ segment in content.split(DIFF_GIT)[1:]:\n        per_file_diff.append(DIFF_GIT\
          \ + segment)\n        filenames.append(re.match(REGEX_PATTERN, segment).group(1))\n\
          \n    skip_primary_message = len(per_file_diff) == 1\n\n    return {\n \
          \       OUTPUT_SKIP_PRIMARY: skip_primary_message,\n        OUTPUT_PER_FILE_DIFF:\
          \ per_file_diff,\n        OUTPUT_FILENAMES: filenames,\n    }\n\n"
